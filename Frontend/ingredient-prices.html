<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChopSmo Ingredient Prices</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            align-items: center;
        }
        .controls label {
            font-weight: 600;
            margin-right: 6px;
        }
        .controls input,
        .controls select {
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        .controls button {
            padding: 8px 14px;
            background: #ff6b35;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        thead {
            background: #f0f6ff;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }
        th {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #5f6b7d;
        }
        tbody tr:hover {
            background: #f9fafb;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .pagination button {
            padding: 8px 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #5f6b7d;
        }
        .status.error {
            color: #b94a48;
        }
        /* Responsive: convert table into card-like rows on small screens */
        @media (max-width: 720px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            table { border: 0; }
            tbody tr { margin-bottom: 12px; background: #fff; border-radius: 10px; box-shadow: 0 6px 18px rgba(2,6,23,0.06); padding: 12px; }
            td { padding: 8px 0; border: none; display: flex; justify-content: space-between; }
            td[data-label]::before { content: attr(data-label); font-weight: 600; color: #5f6b7d; margin-right: 8px; }
            .controls { flex-direction: column; align-items: stretch; }
            .controls > div, .controls button { width: 100%; }
            .controls label { display: block; margin-bottom: 6px; }
            .pagination { flex-direction: column; gap: 8px; align-items: stretch; }
            .pagination button { width: 100%; }
        }
        /* Compact view: hide less-important columns on very small screens */
        @media (max-width: 420px) {
            td[data-label="Vendor"], td[data-label="City"] { display: none; }
        }
        .row-toggle { background: #007bff; color: #fff; border: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
        tr.expanded { box-shadow: 0 8px 30px rgba(2,6,23,0.08); }
        tr.expanded td[data-label="Vendor"], tr.expanded td[data-label="City"] { display: flex; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ingredient Price Directory</h1>
        <p class="status" id="statusMessage">Loading latest prices...</p>
        <div class="controls">
            <div>
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="e.g. tomato, rice, onion">
            </div>
            <div>
                <label for="currencyFilter">Currency</label>
                <select id="currencyFilter">
                    <option value="">All</option>
                    <option value="XAF">XAF</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
            <div>
                <label for="pageSizeSelect">Page Size</label>
                <select id="pageSizeSelect">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div>
                <label for="orderingSelect">Sort</label>
                <select id="orderingSelect">
                    <option value="-updated_at">Newest</option>
                    <option value="price">Lowest Price</option>
                    <option value="-price">Highest Price</option>
                    <option value="ingredient__name">Ingredient A-Z</option>
                </select>
            </div>
            <button id="refreshBtn">Refresh</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Ingredient</th>
                    <th>Price</th>
                    <th>Unit</th>
                    <th>Vendor</th>
                    <th>City</th>
                    <th>Updated</th>
                </tr>
            </thead>
            <tbody id="priceTableBody">
                <tr>
                    <td colspan="6" style="text-align:center; padding:20px;">Loading...</td>
                </tr>
            </tbody>
        </table>
        <div class="pagination">
            <button id="prevPageBtn">Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPageBtn">Next</button>
        </div>
    </div>

    <script src="chopsmo-config.js"></script>
    <script src="auth-utils.js"></script>
    <script type="module" src="ingredient-prices.js"></script>
</body>
</html>
