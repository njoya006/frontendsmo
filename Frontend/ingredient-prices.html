<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChopSmo Ingredient Prices</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root{
            --bg: #f5f7fb;
            --card: #ffffff;
            --muted: #6b7280;
            --primary: #2f855a; /* green to match dashboard accents */
            --accent-start: #2f855a;
            --accent-end: #16a34a;
            --glass-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            --radius-lg: 14px;
        }
        html,body{height:100%;}
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 28px 20px;
            color: #0f172a;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.98));
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            padding: 28px;
            border: 1px solid rgba(15,23,42,0.04);
        }
        h1{
            margin:0 0 8px 0;
            font-weight:600;
            color: #0f172a;
            font-size: clamp(1.4rem, 2.6vw, 1.9rem);
        }
        .subtle{color:var(--muted);margin-top:4px;margin-bottom:18px}

        .controls{
            display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
        }
        .control-item{display:flex;flex-direction:column;gap:6px}
        .control-item label{font-size:13px;font-weight:600;color:var(--muted)}
        .control-item input,.control-item select{padding:10px 12px;border-radius:10px;border:1px solid rgba(15,23,42,0.06);background:#fff;min-width:180px}
        #searchInput{min-width:260px}
        .btn{
            display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:600
        }
        .btn-primary{background:linear-gradient(90deg,var(--accent-start),var(--accent-end));color:#fff;box-shadow:0 8px 24px rgba(16,185,129,0.12)}
        .btn-ghost{background:transparent;border:1px solid rgba(15,23,42,0.06);color:var(--muted)}

        /* Price list grid */
        .price-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:8px 0 18px}
        .price-card{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--glass-shadow);display:flex;flex-direction:column;gap:8px;border:1px solid rgba(15,23,42,0.03)}
        .price-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
        .ingredient{font-weight:600;font-size:16px;color:#071133}
        .price-badge{font-weight:700;color:var(--primary);background:rgba(47,133,90,0.08);padding:6px 10px;border-radius:999px}
        .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px}
        .vendor{font-weight:600;color:#0f172a}
        .small{font-size:13px;color:var(--muted)}

        .card-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
        .updated{font-size:12px;color:var(--muted)}
        .details-btn{background:transparent;border:none;color:var(--primary);font-weight:600;cursor:pointer}

        .empty{padding:24px;text-align:center;color:var(--muted);grid-column:1/-1}

        /* Pagination */
        .pagination{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:6px}

        @media (max-width:820px){
            .controls{align-items:stretch}
            .control-item input,.control-item select{min-width:100%}
            .price-list{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
        }
        @media (max-width:480px){
            body{padding:18px 12px}
            .controls{flex-direction:column;align-items:stretch}
            #searchInput{min-width:100%}
            .price-list{grid-template-columns:1fr}
            .pagination{justify-content:space-between}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ingredient Price Directory</h1>
        <p class="subtle" id="statusMessage">Loading latest prices...</p>
        <div class="controls" role="region" aria-label="Ingredient search and filters">
            <div class="control-item">
                <label for="searchInput">Search</label>
                <input type="text" id="searchInput" placeholder="e.g. tomato, rice, onion" aria-label="Search ingredients">
            </div>
            <div class="control-item">
                <label for="currencyFilter">Currency</label>
                <select id="currencyFilter" aria-label="Filter by currency">
                    <option value="">All</option>
                    <option value="XAF">XAF</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
            <div class="control-item">
                <label for="pageSizeSelect">Page Size</label>
                <select id="pageSizeSelect">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div class="control-item">
                <label for="orderingSelect">Sort</label>
                <select id="orderingSelect">
                    <option value="-updated_at">Newest</option>
                    <option value="price">Lowest Price</option>
                    <option value="-price">Highest Price</option>
                    <option value="ingredient__name">Ingredient A-Z</option>
                </select>
            </div>
            <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
                <button id="refreshBtn" class="btn btn-primary"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button id="exportBtn" class="btn btn-ghost" title="Export list"><i class="fas fa-download"></i></button>
            </div>
        </div>

        <div id="priceList" class="price-list" role="list">
            <div class="empty">Loading...</div>
        </div>

        <div class="pagination" aria-label="Pagination controls">
            <div style="display:flex;gap:8px;align-items:center">
                <button id="prevPageBtn" class="btn btn-ghost">Previous</button>
                <button id="nextPageBtn" class="btn btn-primary">Next</button>
            </div>
            <div id="pageInfo" class="small">Page 1</div>
        </div>
    </div>

    <script src="chopsmo-config.js"></script>
    <script src="auth-utils.js"></script>
    <script type="module" src="ingredient-prices.js"></script>
</body>
</html>
